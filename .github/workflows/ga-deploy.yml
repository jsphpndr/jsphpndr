name: Refresh GA4 (weekly Netlify deploy)

on:
  schedule:
    - cron: '0 12 * * 2'  # Every Tuesday at 12:00 UTC
  workflow_dispatch:

permissions: {}

jobs:
  trigger:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Netlify Build Hook
        run: curl --fail-with-body --silent --show-error --connect-timeout 15 --max-time 60 -X POST -d '{}' https://api.netlify.com/build_hooks/687d796ab820d028b6b22ca0
